<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            display: inline-block;
            padding: 10px;
            margin: 10px;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid black;
            width: 200px;
            text-align: center;
        }

        .card input {
            width: 180px;
            height: 180px;
        }

        #list li {
            display: inline-block;
            width: 100px;
        }
    </style>
</head>

<body>
    <div class="card">
        <input type="button" value="剪刀" data-value="1">
    </div>
    <div class="card">
        <input type="button" value="石頭" data-value="2">
    </div>
    <div class="card">
        <input type="button" value="布" data-value="3">
    </div>
    <ul id="list">
        <li>贏:</li>
        <li>輸:</li>
        <li>平手:</li>
    </ul>

    <script>
        // 設定1到3的亂數：1剪刀、2石頭、3布
        // 設定三個按鈕：1剪刀、2石頭、3布
        // 設定三個li：贏、輸、平手
        // 按鈕數值 - 亂數數值 = 0 => 平手（if）
        // 按鈕數值 - 亂數數值 = 1 || -2 => 贏 + 1（else if）
        // 按鈕數值 - 亂數數值 = 2 || -1 => 輸 + 1（else）

        let win = 0, lose = 0, draw = 0
        const rand = (min, max) => {
            return Math.floor(Math.random() * (max - min + 1)) + min
        }

        const btn = document.querySelectorAll('.card input')

        for (const el of btn) {


            el.onclick = () => {
                const random = rand(1, 3)
                const value = el.dataset.value
                console.log(`電腦： ${random}`)
                console.log(`我： ${value}`)
                const result = value - random
                let verdict = ''
                if (result === 0) {
                    verdict = '平手'
                    draw++
                } else if (result === 1 || result === -2) {
                    verdict = '贏'
                    win++
                } else {
                    verdict = '輸'
                    lose++
                }
                console.log(verdict)
                console.log(`${win},${lose},${draw}`)
                list.children[0].innerText = `贏:${win}`
                list.children[1].innerText = `輸:${lose}`
                list.children[2].innerText = `平手:${draw}`
                const text = `你出${value}，電腦出${random}，${verdict}`
                alert(text)
                const ul = document.createElement('ul')
                ul.innerText = text
                list.append(ul)
                // 數字改成文字
            }

        }

    </script>
</body>

</html>
