<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜拳</title>
    <style>
        .card {
            display: inline-block;
            box-sizing: border-box;
            width: 200px;
            padding: 10px;
            margin: 10px;
            border-radius: 10px;
            border: 1px solid black;
            text-align: center;
        }

        .card input {
            width: 180px;
            height: 180px;
        }

        #list li {
            display: inline-block;
            box-sizing: border-box;
            width: 100px;
        }
    </style>
</head>

<body>
    <div class="card">
        <input type="button" value="剪刀" data-value="0">
    </div>
    <div class="card">
        <input type="button" value="石頭" data-value="1">
    </div>
    <div class="card">
        <input type="button" value="阿布" data-value="2">
    </div>
    <ul id="list">
        <li>贏:</li>
        <li>輸:</li>
        <li>平:</li>
    </ul>
    <ul id="record"></ul>
    <script>
        // 設定0到2的亂數：0剪刀、1石頭、2阿布
        // 設定三個按鈕：0剪刀、1石頭、2阿布
        // 設定三個li：贏、輸、平手
        // 按鈕數值 - 亂數數值 = 0 => 平（if）
        // 按鈕數值 - 亂數數值 = 1 || -2 => 贏 + 1（else if）
        // 其他 => 輸 + 1（else）
        const gameset = ['剪刀', '石頭', '阿布']
        const score = { 贏: 0, 輸: 0, 平: 0 }
        const rand = () => Math.floor(Math.random() * 3)
        // console.log(rand)
        const choices = document.querySelectorAll('.card input')
        let win = 0, lose = 0, draw = 0
        for (const el of choices) {
            el.onclick = () => {
                const cpu = rand()
                const me = Number(el.dataset.value)
                // console.log(`電腦： ${cpu}`)
                // console.log(`我： ${me}`)
                const calc = me - cpu
                let verdict = ''
                if (calc === 0) {
                    verdict = '平'
                    draw++
                } else if (calc === 1 || calc === -2) {
                    verdict = '贏'
                    win++
                } else {
                    verdict = '輸'
                    lose++
                }
                // console.log(verdict)
                // console.log(`${win},${lose},${draw}`)
                list.children[0].innerText = `贏:${win}`
                list.children[1].innerText = `輸:${lose}`
                list.children[2].innerText = `平:${draw}`
                const result = `你出${gameset[me]}，命運出${gameset[cpu]}，${verdict}`
                const li = document.createElement('li')
                li.innerText = result
                record.prepend(li)
                // alert(result)
            }
        }


    </script>
</body>

</html>
