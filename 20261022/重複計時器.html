<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let i = 10;
        let j = 6;

        let timer = setInterval(() => {
            document.write('$');
            i--;
            if (i === 0) {
                document.write('<br>');
                i = 10;
                j--;
                if (j === 0) {
                    document.write('<hr>');
                    j = 6
                }
            }
        }, 1000);

    </script>
</body>

</html>
