<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let a = 10
        a++
        console.log(a)  //11
        ++a
        console.log(a)  //12
        //用逗號,同時宣告多個變數
        let b = 0, c = 10
        b = c++
        // b = c 10 10
        // c++ 10 11
        console.log(b, c)  //10 11
        let d = 0, e = 10
        d = ++e
        // e++ 0 11
        // d = e 11 11
        //先處理等號後面的值
        console.log(d, e)   //11 11
    </script>
</body>

</html>
