<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //數字
        let pi = 3.14
        console.log(pi)

        //布林值
        let bool = false
        console.log(bool)

        //文字
        let text1 = 'aa\'aa'   // 反斜綫是跳脫
        console.log(text1)
        let text2 = "bb\"bb"   // 反斜綫是跳脫
        console.log(text2)
        //只有頓號`可以換行
        let text3 = `ccc
        ccc
        ccc`
        console.log(text3)
    </script>
</body>

</html>
