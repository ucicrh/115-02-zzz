<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const rain = confirm('雨')
        const umbrella = confirm('傘')

        if (rain) {
            if (umbrella) {
                document.write('<p>出門有帶傘沒事</p>')
            } else {
                document.write('<p>準備雨衣</p>')
            }
        } else {
            document.write('<p>沒事</p>')
        }
    </script>
</body>

</html>
