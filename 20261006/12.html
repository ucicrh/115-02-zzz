<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>dice</title>

    <style>
        .container {
            width: 1230px;
            height: 200px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: auto;
        }

        .dice {
            width: 200px;
            height: 200px;
            border: 1px solid #777;
            box-shadow: 3px 3px 2px 2px #777;
            border-radius: 20px;
            background-image: linear-gradient(315deg, #777, ivory);
            position: absolute;
        }

        .num {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: black;
            box-shadow: 0 0 2px 2px #777;
            border-radius: 50%;
        }
    </style>

</head>
