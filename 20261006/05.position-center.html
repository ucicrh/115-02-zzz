<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .circle {
            width: 300px;
            height: 300px;
            background-color: aqua;
            border-radius: 50%;
            position: absolute;
            /* 這三行是水平垂直居中 */
            top: 50%;
            left: 50%;
            /* 使用transform 進行微調，左150px 上150px */
            transform: translate(-50%, -50%);
        }

        .midc {
            width: 200px;
            height: 200px;
            background-color: yellow;
            border-radius: 50%;
            position: absolute;
            /* 這三行是水平垂直居中 */
            top: 50%;
            left: 50%;
            /* 使用transform 進行微調，左150px 上150px */
            transform: translate(-50%, -50%);
        }

        .smallc {
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            /* 這三行是水平垂直居中 */
            top: 50%;
            left: 50%;
            /* 使用transform 進行微調，左150px 上150px */
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <!-- 絕對定位或固定定位可以做到水平垂直居中的效果 -->
    <!-- 父層產生定位，子層可以參考它的有 relative absolute fixed -->
    <div class="circle"></div>
    <div class="midc"></div>
    <div class="smallc"></div>

</body>

</html>
