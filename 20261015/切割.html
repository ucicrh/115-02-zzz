<body>
    <script>
        let text = 'abcdefg'
        // .........0123456

        console.log(text.slice(2, 5))
        //234,不含5 => cde

        console.log(text.slice(-6, -2))
        //-6 => 7 - 6 = 1, -2 => 7 - 2 = 5
        //(-6, -2) => (1, 5) => bcde
    </script>
