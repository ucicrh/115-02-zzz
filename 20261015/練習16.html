<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const ledger = [];
        let sum = 0
        for (; ;) {
            const amount = Number(prompt('請輸入金額'));
            if (amount == 0) break;
            ledger.push = ((amount));
            sum += amount;
        }
        document.write(ledger.join(' + '));
        document.write(' = ', sum);

    </script>
</body>

</html>
