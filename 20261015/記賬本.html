        const ledger = []
        let sum = 0
        while (true) {
            const input = prompt('請輸入數字（輸入 0 或按取消可結算支出）')
            if (input === null || input == 0 || input.trim() === '') break
            ledger.push(input * 1)
            sum += (input * 1)
        }
        document.write(ledger.join(' + '))
        document.write(' = ', sum)

    </script>
