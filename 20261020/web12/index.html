<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立科技高中─校園社團介紹網</title>
    <style>
        #main {
            width: 1024px;
            height: 768px;
            margin: auto;
            /* background: lightblue; */
        }

        #top {
            width: 1000px;
            height: 65px;
            margin: auto;
            /* background-color: blue; */
        }

        #left {
            width: 215px;
            /*  calc() 可以計算 */
            /* “ + - * / ” 左右兩側要半形空白 */
            height: calc(768px - 65px - 20px);
            float: left;
            margin-left: 12px;
            /* background-color: brown; */
        }

        #menu {
            width: 215px;
            height: calc(768px - 65px - 20px - 25px);
            /* background-color: azure; */
        }

        #update {
            width: 215px;
            height: 25px;
            /* background-color: cadetblue; */
            font-family: "標楷體";
            font-size: 16px;
            color: black;
            text-align: center;

        }

        #right {
            width: 770px;
            height: calc(768px - 65px - 20px);
            float: right;
            margin-right: 12px;
            /* background-color: black; */
        }

        #menu div {
            font-family: 標楷體;
            font-size: 24px;
            color: #f0f;
            font-weight: 500;
            text-decoration: underline;
            text-align: center;
        }

        #menu td {
            width: 215px;
            /* 也可以 35 px ，根據 menu1.png 的高度，40的版型比較好看 */
            height: 40px;
            font-family: 標楷體;
            font-size: 16px;
            color: black;
            text-align: center;
            background: url(./images/menu1.png) no-repeat center;
        }

        #menu td:hover {
            background: url(./images/menu2.png) no-repeat center;

        }

        /* 這個可以不寫 */
        #manu a {
            display: block;
            line-height: 40px;
        }

        marquee {
            width: 770px;
            height: 29px;
            /* background-color: violet; */
            /* 
            考試可以不寫，處理掉marqee下方空白問題
            */
            vertical-align: middle;
            font-family: "標楷體";
            font-size: 24px;
            color: blue;
        }

        iframe {
            width: 770px;
            height: calc(768px - 65px - 29px - 20px);
            /* background-color: red; */
        }

        #footer {
            width: calc(1000px);
            height: 20px;
            margin: auto;
            clear: both;
            /* background-color: chocolate; */
            font-family: "標楷體";
            font-size: 16px;
            color: black;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="main">
        <!-- alt 替代文字，網頁鏈接有錯誤時顯示的文字 -->
        <div id="top"><a href="./index.html"></a><img src="./images/logo.png" alt="國立科技高中校園社團介紹網" title="國立科技高中校園社團介紹網">
        </div>
        <div id="left">
            <div id="menu">
                <div>社團介紹</div>
                <!-- table>tr*6>td -->
                <table>
                    <tr>
                        <td><a href="./guitar_history.html" target="iframe">吉他社</a></td>
                    </tr>
                    <tr>
                        <td>熱舞社</td>
                    </tr>
                    <tr>
                        <td>棒球社</td>
                    </tr>
                    <tr>
                        <td>羽球社</td>
                    </tr>
                    <tr>
                        <td>足球社</td>
                    </tr>
                    <tr>
                        <td>童軍社</td>
                    </tr>
                </table>
            </div>
            <div id="update">最近更新日期：2026/11/27</div>
        </div>
        <div id="right">
            <marquee behavior="" direction="">歡迎光臨校園社團介紹網，參觀後請支持社團活
                動並熱烈參與</marquee>
            <!-- iframe = content -->
            <iframe src="./main.html" frameborder="0" name="iframe"></iframe>
        </div>
        <div id="footer">網頁設計及維護：12張聖威</div>
    </div>
</body>

</html>
