<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        for (let i = 1; i <= 9; i++) {
            if (i != 5)
                document.write(i + " ")
        }

        document.write('<hr>')

        for (let i = 1; i <= 9; i++) {
            if (i == 5) continue
            document.write(i)
        }

        document.write('<hr>')

        for (let i = 1; i <= 9; i++) {
            if (i == 5) break
            document.write(i)
        }
    </script>
</body>

</html>
