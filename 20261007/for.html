<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        for (let i = 1; i < 11; i++) {
            document.write(i + ' ')
        }

        document.write('<hr>')

        for (let i = 1; i < 11; i++) {
            if (i == 1 || i == 4 || i == 7 || i == 10)
                document.write(i + ' ')
        }

        document.write('<hr>')

        for (let i = 1; i < 11; i = i + 3) {
            document.write(i + ' ')
        }

        document.write('<hr>')

        for (let i = 1; i < 11; i += 3) {
            document.write(i + ' ')
        }
        document.write('<hr>')


        for (let r = 0; r < 256; r += 5) {

            let b = 255 - r;
            document.write(`<span style="color: rgb(${r}, 0, ${b})" >★</span >`)

        }


    </script>
</body>

</html>
