<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .card {
      width: 50px;
      height: 90px;
      position: relative;
      margin: 10px;
      float: left;
      /* 設定內層元素在 3D 空間裡面 */
      transform-style: preserve-3d;
      transition: transform .5s;
    }

    .card-close {
      transform: rotateY(180deg);
    }

    .card-front {
      width: 100%;
      height: 100%;
      position: absolute;
      background-image: url(./cards/1H.jpg);
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      backface-visibility: hidden;
    }

    .card-back {
      width: 100%;
      height: 100%;
      position: absolute;
      background-image: url(./cards/Red_back.jpg);
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      backface-visibility: hidden;
      transform: rotateY(180deg);
    }
  </style>
</head>

<body>
  <!-- 
    <div class="card">
      <div class="card-front"></div>
      <div class="card-back"></div>
    </div>
  -->
  <div id="game"></div>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js'
    integrity='sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=='
    crossorigin='anonymous'></script>
  <script>
    // 產生 16 張卡片
    for (let i = 1; i <= 16; i++) {
      // 決定卡片數字，兩組 1 ~ 8
      const num = i % 8 || 8
      // console.log(num)

      $('#game').append(`
        <div class="card card-close" data-num="${num}">
          <div class="card-front" style="background-image: url(./cards/${num}H.jpg)"></div>
          <div class="card-back"></div>
        </div>
      `)
    }

    // 打亂
    for (let i = 0; i < 100; i++) {
      // 隨機取 2 張卡片
      // 卡片 16 張，索引 0 ~ 15
      const randA = Math.floor(Math.random() * 16)
      const randB = Math.floor(Math.random() * 16)

      // A.insertAfter(B)
      // 把 A 放到 B 後面
      $('.card').eq(randA).insertBefore($('.card').eq(randB))
    }

    $('.card').on('click', function () {
      // 翻牌
      if (
        // 最多翻開 2 張，檢查已翻開的數量
        $('.card:not(.card-close)').length < 2 &&
        // 這張牌還沒翻開
        $(this).hasClass('card-close') &&
        // 這張牌還沒配對
        !$(this).hasClass('card-ok')
      ) {
        $(this).removeClass('card-close')
      }

      // 如果翻開兩張了
      if ($('.card:not(.card-close)').length === 2) {
        // 如果數字一樣
        if (
          $('.card:not(.card-close)').eq(0).attr('data-num') ===
          $('.card:not(.card-close)').eq(1).attr('data-num')
        ) {
          // 標記已配對
          $('.card:not(.card-close)').addClass('card-ok')
          $('.card:not(.card-close)').fadeTo(1000, 0)
        }

        // 等待淡出動畫和 transition 結束
        setTimeout(function () {
          // 不管有沒有配對到，都翻回背面
          $('.card:not(.card-close)').addClass('card-close')
          // 如果已配對數量 = 卡片數量，過關
          if (
            $('.card-ok').length === $('.card').length
          ) {
            alert('過關')
          }
        }, 1000)
      }
    })
  </script>
</body>

</html>
