<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #game {
            width: 500px;
            height: 500px;
            background: black;
            position: relative;
            overflow: hidden;
            cursor: url(./cursor.png) 50 50, auto;

            img {
                height: 100px;
                position: absolute;
                user-select: none;
                -webkit-user-drag: none;
            }
        }

        .blood {
            pointer-events: none;
        }
    </style>
</head>

<body>
    <input type="button" value="開始遊戲" id="btn-start">
    <br>
    分數: <span id="text-score">0</span>
    <br>
    剩餘: <span id="text-time">0</span>
    <br>
    最高分: <span id="text-highname">沒有人</span> - <span id="text-highscore">0</span>
    <div id="game"></div>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js'
        integrity='sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=='
        crossorigin='anonymous'></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // 遊戲時間設定
        const GAME_TIME = 5

        // 分數
        let score = 0
        // 剩餘時間
        let timeleft = 0
        // 計時器
        let timer = 0
        // 最高分
        const highscore = {
            name: '',
            score: 0
        }

        if (localStorage.shoot) {
            const data = JSON.parse(localStorage.shoot)
            highscore.score = data.score
            $('#text-highscore').text(data.score)
            highscore.name = data.name
            $('#text-highname').text(data.name)
        }

        function move(target) {
            // 隨機位置
            const top = Math.round(Math.random() * 100) + '%'
            const left = Math.round(Math.random() * 100) + '%'
            const duration = Math.round(Math.random() * 3000)
            // .animate(要變成的樣式, 動畫時間, 動畫播完後執行的 function)
            // 動畫時間預設 400ms，fast = 200，slow = 600
            target.animate({ top, left }, duration, function () {
                move(target)
            })
        }

        $('#btn-start').on('click', function () {
            // 停用開始遊戲按鈕
            $(this).attr('disabled', true)
            // 重設
            score = 0
            $('#text-score').text(score)
            timeleft = GAME_TIME
            $('#text-time').text(timeleft)

            // setInterval 的 function 的 this 指的是 window
            // 先把 click 事件的 this 放進變數中給內層使用
            const _this = this

            timer = setInterval(function () {
                // 倒數
                timeleft--
                $('#text-time').text(timeleft)

                // 產生目標
                // 隨機數字 > 2，且區域內目標數 < 10 才產生
                const random = Math.round(Math.random() * 9)
                if (random > 2 && $('.target').length < 10) {
                    // 隨機位置
                    const top = Math.round(Math.random() * 100) + '%'
                    const left = Math.round(Math.random() * 100) + '%'
                    // 產生目標
                    const target = $(`<img src="./kodai_sacabambaspis.png" class="target">`)
                    target.css({ top, left })
                    $('#game').append(target)
                    move(target)
                }

                if (timeleft === 0) {
                    clearInterval(timer)
                    $('#game').empty()
                    $(_this).attr('disabled', false)

                    if (score > highscore.score) {
                        Swal.fire({
                            title: '最高分',
                            text: '請輸入玩家名稱',
                            input: 'text'
                        }).then(function (result) {
                            console.log(result)
                            const name = result.value || '路人'
                            highscore.score = score
                            $('#text-highscore').text(score)
                            highscore.name = name
                            $('#text-highname').text(name)

                            localStorage.shoot = JSON.stringify(highscore)
                        })
                    }
                }
            }, 1000)
        })

        // 當點到 #game 時，event.target 是 .target 時
        $('#game').on('click', '.target', function () {
            // 加分
            score++
            $('#text-score').text(score)
            // 停止動畫
            $(this).stop()
            // 換圖片
            $(this).attr('src', './blood.png')
            $(this).removeClass('target').addClass('blood')
        })
    </script>
</body>

</html>
