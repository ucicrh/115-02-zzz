<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const sum = n => {
            if (n === 1) {
                return 1
            } else {
                return n + sum(n - 1)
            }
        }

        document.write(sum(5) + '<br>')
    </script>
</body>

</html>
