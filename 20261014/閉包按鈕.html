<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>閉包按鈕計數</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: sans-serif;
        }

        .buttons {
            display: flex;
            gap: 24px;
        }

        .counter {
            text-align: center;
        }

        .count {
            margin-bottom: 8px;
            font-size: 24px;
        }

        button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="buttons">
        <div class="counter">
            <div class="count">0</div>
            <button type="button">按鈕 1</button>
        </div>
        <div class="counter">
            <div class="count">0</div>
            <button type="button">按鈕 2</button>
        </div>
        <div class="counter">
            <div class="count">0</div>
            <button type="button">按鈕 3</button>
        </div>
        <div class="counter">
            <div class="count">0</div>
            <button type="button">按鈕 4</button>
        </div>
    </div>

    <script>
        document.querySelectorAll('.counter').forEach(counter => {
            let count = 0
            const display = counter.querySelector('.count')
            const button = counter.querySelector('button')

            button.addEventListener('click', () => {
                count++
                display.textContent = count
            })
        })
    </script>
</body>

</html>
