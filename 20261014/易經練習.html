<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const gua = (array) => {
            for (let i = 0; i < array.length; i++) {
                if (array[i] < 100 || array[i] > 999) {
                    document.write('請輸入三個三位數')
                    return
                }

            }

            const trigrams = ['乾', '兌', '離', '震', '巽', '坎', '艮', '坤']
            const downSign = array[0] % 8 || 8
            const topSign = array[1] % 8 || 8
            const number3 = array[2] % 6 || 6
            return [
                trigrams[downSign - 1],
                trigrams[topSign - 1],
                number3
            ]
        }

        const number1 = Number(prompt('第一個三位數'))
        const number2 = Number(prompt('第二個三位數'))
        const number3 = Number(prompt('第三個三位數'))
        const numbers = [number1, number2, number3]
        const result = gua(numbers)
        console.log(result[0]) // 輸出 離
        console.log(result[1]) // 輸出 震
        console.log(result[2]) // 輸出 2
    </script>
</body>

</html>
