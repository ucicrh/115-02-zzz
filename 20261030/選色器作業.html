<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #color-box {
            width: 300px;
            height: 300px;
            border: 1px solid black;
            background-color: rgb(0 0 0);
        }

        ul {
            width: 300px;
            line-height: 2;
        }
    </style>
</head>

<body>
    <div id="color-box">
    </div>
    <ul>
        <li>R<input id="red-slider" type="range" min="0" max="255" step="1" value="0">
        </li>
        <li>G<input id="green-slider" type="range" min="0" max="255" step="1" value="0">
        </li>
        <li>B<input id="blue-slider" type="range" min="0" max="255" step="1" value="0">
        </li>
    </ul>
    <script>
        const r = document.getElementById('red-slider')
        const g = document.getElementById('green-slider')
        const b = document.getElementById('blue-slider')
        const colorBox = document.getElementById('color-box')

        const updateColor = () => {
            colorBox.style.backgroundColor = `rgb(${r.value} ${g.value} ${b.value})`
        }
        r.oninput = updateColor
        g.oninput = updateColor
        b.oninput = updateColor

    </script>
</body>

</html>
