<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .taichi {
            width: 400px;
            height: 400px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .yinyang {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: linear-gradient(to right, white 50%, black 50%);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
            position: absolute;
            transition: 10s;
        }

        .yinyang::before {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: white;
            transition: 0.5s;
            left: 100px;
            top: 0;
            box-shadow: 0 200px 0 black;
        }

        .yinyang::after {
            content: "";
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: black;
            transition: 0.5s;
            left: 175px;
            top: 75px;
            box-shadow: 0 200px 0 white;
        }

        .yinyang:hover {
            transform: rotate(360deg) rotateX(540deg) scale(80%) skew(20deg) translate(10%, 10%);
            transform-origin: center;
            background: linear-gradient(to right, black 50%, white 50%);
            /* transform-origin: top left; */
        }
    </style>

</head>

<body>
    <div class="taichi">
        <div class="yinyang"></div>
    </div>
</body>

</html>
