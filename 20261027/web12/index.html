<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勞動部勞動力發展署─運動廣場連結網</title>
    <style>
        body {
            background-color: #42413C;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            text-align: center;
            /* 合并儲存格，邊緣去除 */
            border-collapse: collapse;
        }

        td {
            padding: 0;
        }

        .main {
            margin: auto;
            width: 1024px;
            height: 768px;
            background-color: #FFFFFF;
        }

        .top {
            width: 1024px;
            height: 90px;
            background-color: #00B0F0;
        }

        .logo {
            width: 180px;
            height: 90px;
        }

        .title {
            font-size: 52px;
            color: white;
            font-family: 標楷體;
            text-shadow: 10px 10px 15px #333;
        }

        .menu {
            width: 1024px;
            height: 25px;
        }

        .menu a {
            background-color: #eee;
            color: #000;
            text-decoration: none;
            /* 沾滿 td 空間 */
            display: block;
        }

        .menu a:hover {
            color: #f00;
            font-size: 14px;
            background-color: #FFFF00;
            font-weight: bold;
        }

        .content {
            width: 1024px;
            height: calc(768px - 90px - 25px - 45px);
            padding: 20px;
            box-sizing: border-box;
        }

        /* content 設定 padding 20px */
        iframe {
            width: calc(1024px - 40px);
            height: calc(768px - 90px - 25px - 45px - 40px);
        }

        .footer {
            width: 1024px;
            height: 45px;
            background-color: #CCCCCC;
            color: white;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <!-- .main>.top+.menu+.content+.footer -->
    <div class="main">
        <div class="top">
            <table style="table-layout: fixed;">
                <tr>
                    <td class="logo">
                        <a href="./index.html">
                            <img src="./images/logo.png" alt="運動廣場連結網" title="運動廣場連結網">
                        </a>
                    </td>
                    <td class="title">運動廣場連結網</td>
                </tr>
            </table>
        </div>
        <div class="menu">
            <table>
                <tr>
                    <td width="1"><a href="./index.html">首頁</a></td>
                    <td width="1"><a href="./results/health.html" target="iframe">健康天地</a></td>
                    <td width="1"><a href="./results/basketball.html" target="iframe">籃球介紹</a></td>
                    <td width="1"><a href="./results/baseball.html" target="iframe">棒球介紹</a></td>
                    <td width="1"><a href="./results/swimming.html" target="iframe">游泳介紹</a></td>
                    <td width="1"><a href="./results/msgboard.html" target="iframe">訪客留言</a></td>
                    <td width="1"><a href="./results/reference.html" target="iframe">資料來源</a></td>
                </tr>
            </table>
        </div>
        <div class="content">
            <iframe name="iframe" src="./results/main.html" width="100%" height="100%" frameborder="0"></iframe>
        </div>
        <div class="footer">網頁設計及維護：12張XX<br>最近更新
            日期：2026/10/27</div>
    </div>
</body>

</html>
