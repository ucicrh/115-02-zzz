管制、稽核","絕對不使用網路","技術性管制","警衛、門禁"],"answer":2,"page":37,"figure":false},{"item":"04 資訊及安全","no":45,"q":"一般資訊中心為確保電腦作業而採取各種防護的措施，何者不在防護的項目之內？","options":["實體設備","資料","軟體系統","差假記錄"],"answer":4,"page":37,"figure":false},{"item":"04 資訊及安全","no":46,"q":"何者是數位簽名的功能？","options":["確認發信人身分","回傳給本人","加密","密件副本"],"answer":1,"page":37,"figure":false},{"item":"04 資訊及安全","no":47,"q":"將原執行檔程式的程序中斷，布下陷阱後，再回頭繼續原始程式的病毒為何種？","options":["記憶體病毒","開機型病毒","檔案型病毒","CPU 病毒"],"answer":3,"page":38,"figure":false},{"item":"04 資訊及安全","no":48,"q":"何者不是電腦病毒的特性？","options":["病毒一旦病發就一定無法解毒","電腦病毒寄生在正常程式中，伺機將自己複製並感染給其它正常程式","有些病毒發作時會降低 CPU 的執行速度","當病毒感染正常程式中，並不一定會立即發作，有時須條件成立時，才會發病"],"answer":1,"page":38,"figure":false},{"item":"04 資訊及安全","no":49,"q":"關於「防治電腦病毒」之敘述何者正確？","options":["一般電腦病毒可以分為開機型、檔案型及混合型三種","電腦病毒只存在記憶體、開機磁區及執行檔中","受病毒感染的檔案，不執行也會發作","遇到開機型病毒，只要無毒的開機隨身碟重新開機後即可清除"],"answer":1,"page":38,"figure":false},{"item":"04 資訊及安全","no":50,"q":"資訊安全管理制度依循哪個標準？","options":["ISO 27001","ISO 45001","ISO 15408","ISO 21434"],"answer":1,"page":38,"figure":false},{"item":"04 資訊及安全","no":51,"q":"關於「電腦病毒防治方式」之敘述何者錯誤？","options":["只要將被感染之程式刪除就不會再被感染","用乾淨無毒的開機系統開機","不使用來路不明之軟體","電腦上加裝防毒軟體"],"answer":1,"page":38,"figure":false},{"item":"04 資訊及安全","no":52,"q":"硬式磁碟機(HDD)/固態硬碟(SSD)為防資料流失或中毒，應常定期執行何種工作？","options":["查檔","備份","規格化","用清潔片清洗"],"answer":2,"page":38,"figure":false},{"item":"04 資訊及安全","no":53,"q":"關於「電腦病毒」之敘述何者錯誤？","options":["開機型病毒，開機後，即有病毒侵入記憶體","中毒的檔案，由於病毒程式的寄居，檔案通常會變大","主記憶體無毒，此時 COPY 無毒的檔案到 USB 隨身碟，將使其中毒","檔案型病毒，將隨著檔案的執行，載入記憶體"],"answer":3,"page":38,"figure":false},{"item":"04 資訊及安全","no":54,"q":"電腦病毒的發作起因為何？","options":["操作不當","程式產生","記憶體突變","細菌感染"],"answer":2,"page":38,"figure":false},{"item":"04 資訊及安全","no":55,"q":"何種程式軟體是以竊取資料為主，並不希望被駭客發現它的存在，才能繼續躲藏，並藉由網路將被竊資料傳送給駭客？","options":["間諜程式","電腦病毒","P2P 軟體","備份程式"],"answer":1,"page":38,"figure":false},{"item":"04 資訊及安全","no":56,"q":"關於「電腦設備」之管理何者錯誤？","options":["所有設備專人管理","定期保養設備","允許使用者因個人方便隨意搬移設備","使用電源穩壓器"],"answer":3,"page":38,"figure":false},{"item":"04 資訊及安全","no":57,"q":"何種系統可以確保穩定的電腦電源？","options":["不斷電系統","網路系統","廣播系統","保全系統"],"answer":1,"page":38,"figure":false},{"item":"04 資訊及安全","no":58,"q":"不斷電系統(UPS)的主要功能為何？","options":["防毒","傳送檔案","維護電源品質","通訊協定"],"answer":3,"page":38,"figure":false},{"item":"04 資訊及安全","no":59,"q":"學校的電腦中心若發生火災時，使用何種滅火器材最適宜？","options":["二氧化碳滅火器","泡沫滅火器","水","乾粉滅火器"],"answer":1,"page":38,"figure":false},{"item":"04 資訊及安全","no":60,"q":"集線器(Hub)的網路運作是屬於 OSI 七層的哪一層？","options":["實體層","應用層","網路層","資料鏈結層"],"answer":1,"page":38,"figure":false},{"item":"04 資訊及安全","no":61,"q":"交換器(L2 Switch)的網路運作是屬於 OSI 七層的哪一層？","options":["實體層","應用層","傳輸層","資料鏈結層"],"answer":4,"page":38,"figure":false},{"item":"04 資訊及安全","no":62,"q":"SSH(Secure SHell protocol)伺服器為較為安全的遠端連線伺服器，其預設通訊埠號為何？","options":["22","53","80","110"],"answer":1,"page":39,"figure":false},{"item":"04 資訊及安全","no":63,"q":"何者不屬於資訊安全管理的層次？","options":["資安治理","資安管理","財務管理","技術管理"],"answer":3,"page":39,"figure":false},{"item":"04 資訊及安全","no":64,"q":"根據美國國家安全局(NSA)、國家標準技術研究所(NIST)所提出的資安指南，何者不是主要的資訊安全三大要素？","options":["流通性(Liquidity)","機密性(Confidentiality)","完整性(Integrity)","可用性(Availability)"],"answer":1,"page":39,"figure":false},{"item":"04 資訊及安全","no":65,"q":"發現電腦受勒索軟體攻擊時，第一時間如何緊急處置較妥適？","options":["中斷網路連線","電腦關機","電腦重灌","啟用備份資料"],"answer":1,"page":39,"figure":false}];
const $=id=>document.getElementById(id);
const items=[...new Set(DATA.map(d=>d.item))];
$("item").innerHTML=items.map(i=>`<option>${i}</option>`).join("");
let done=0,right=0;
function render(qs){
  done=right=0;score();
  $("list").innerHTML="";
  qs.forEach((d,idx)=>{
    const box=document.createElement("div");box.className="q";
    const h=document.createElement("div");h.className="meta";h.textContent=`${d.item} 第 ${d.no} 題`+(d.figure?"（含圖/程式碼，請對照原卷）":"");
    const t=document.createElement("pre");t.textContent=`${idx+1}. ${d.q}`;
    box.append(h,t);
    let answered=false;
    d.options.forEach((o,i)=>{
      const b=document.createElement("button");b.className="opt";b.textContent=`${"①②③④⑤"[i]} ${o}`;
      b.onclick=()=>{if(answered)return;answered=true;done++;
        if(i+1===d.answer){right++;b.classList.add("ok")}else{b.classList.add("bad");box.children[2+d.answer-1].classList.add("ok")}
        if(d.note){const n=document.createElement("div");n.className="meta";n.textContent="⚠ "+d.note;box.append(n)}
        score()};
      box.append(b);
    });
    $("list").append(box);
  });
}
function score(){$("score").textContent=done?`已答 ${done}　答對 ${right}`:""}
const cur=()=>DATA.filter(d=>d.item===$("item").value);
$("item").onchange=()=>render(cur());
$("all").onclick=()=>render(cur());
$("shuffle").onclick=()=>render(cur().sort(()=>Math.random()-.5).slice(0,20));
render(cur());
</script></body></html>
