<!-- 宣告這份文件使用 HTML5 版本 -->
<!DOCTYPE html>
<!-- 開始 HTML 文件，設定語言為英文 -->
<html lang="en">

<!-- 開始 head 區塊，放置頁面資訊與設定 -->
<head>
    <!-- 設定文件的字元編碼為 UTF-8，支援中文 -->
    <meta charset="UTF-8">
    <!-- 設定視口，讓頁面能在手機上正確縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 設定頁籤標題 -->
    <title>Document</title>
</head>

<!-- 開始 body 區塊，放置網頁內容 -->
<body>
    <!-- 啟動 JavaScript 腳本 -->
    <script>
        // 建立一個陣列 alphabets，裡面存放字母 a、b、c、d
        const alphabets = ['a', 'b', 'c', 'd']
        // 陣列索引位置對應：0, 1, 2, 3
        // .................0....1....2....3

        // 顯示陣列長度，length 會回傳元素個數
        document.write(`<p>陣列長度:${alphabets.length}</p>`)
        // 讀取索引 0 的元素，會輸出 'a'
        document.write(`<p>索引0:${alphabets[0]}</p >`)
        // 讀取不存在的索引 100，會得到 undefined
        document.write(`<p>索引100:${alphabets[100]}</p>`)

        // 使用 .at(2) 讀取索引 2，結果是 'c'
        document.write(`<p>索引 at 2:${alphabets.at(2)}</p>`)

        // 使用 .at(-3) 會從陣列尾部往前數，-3 對應到索引 1，輸出 'b'
        document.write(`<p>索引 at -3:${alphabets.at(-3)}</p>`)
        // 計算最後一個元素：陣列長度 - 1 = 3，取到 'd'
        document.write(`<p>最後一個:${alphabets[alphabets.length - 1]}</p>`)

        // 開始建立無序清單列表
        document.write('<ul>')
        // 用 for 迴圈逐一讀取陣列元素
        for (let i = 0; i < alphabets.length; i++) {
            // 將每個元素包成 <li>，並寫入頁面
            document.write(`<li>${alphabets[i]}</li>`)
        }
        // 結束無序清單
        document.write('</ul>')
    </script>
</body>

</html>
