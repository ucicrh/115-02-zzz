<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>威力彩模擬器</title>
    <style>
        #btn {
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }

        #lottery {
            line-height: 2;
        }

        .ball {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            color: white;
            text-shadow:
                1px 0px black,
                0px -1px black,
                -1px 0px black,
                0px 1px black,
                1px 1px black,
                1px -1px black,
                -1px 1px black,
                -1px -1px black;

            border-radius: 50%;
            background-image: radial-gradient(circle at 30% 30%, white, darkorange);
        }

        .sec2 {
            /* color: red; */
            background-image: radial-gradient(circle at 30% 30%, white, red);
        }
    </style>
</head>

<body>
    <input id="btn" type="button" value="抽獎">
    <div id="lottery"></div>
    <script>
        // 設抽獎按鈕
        // 設亂數產生器函數
        // 設第一區獎金池 1 - 38 陣列
        // 設中獎池 空 陣列
        // 用回圈6次抽取中獎號碼，從獎金池剔除中獎號碼splice，中獎號碼推入中獎池push
        // 將以上流程打包成抽獎函數
        // 頁面變更顯示結果innerHTML

        const btn = document.querySelector('#btn')
        const lottery = document.querySelector('#lottery')
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min
        const pad = n => String(n).padStart(2, '0')
        const draw = () => {
            const pool = Array.from({ length: 38 }, (_, i) => i + 1)
            const sec1 = []
            for (let i = 0; i < 6; i++) {
                const index = rand(0, pool.length - 1)
                sec1.push(pool.splice(index, 1)[0])
            }
            sec1.sort((a, b) => a - b)
            return { sec1, sec2: rand(1, 8) }
        }
        const present = ({ sec1, sec2 }) => {
            console.log(sec1, sec2)
            const ball = n => `<span class="ball">${pad(n)}</span>`
            lottery.innerHTML = `${sec1.map(ball).join(' ')}<br><span class="ball sec2">${pad(sec2)}</span>`
        }
        btn.onclick = () => present(draw())
    </script>
</body>

</html>
